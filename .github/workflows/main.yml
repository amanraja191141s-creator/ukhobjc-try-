name: Sable Calculator v101.0 — Android Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sable-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify exact Sable source
        shell: bash
        run: |
          set -Eeuo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          const h=fs.readFileSync('index.html','utf8');
          const m=JSON.parse(fs.readFileSync('manifest.webmanifest','utf8'));
          if(p.name!=='sable-calculator'||p.version!=='2.01.0-v101.0') throw new Error('Wrong project or version');
          if(!h.includes(p.version)||m.name!=='Sable Calculator') throw new Error('Release identity mismatch');
          for(const f of ['assets/css/app.css','assets/js/app.js','assets/js/sable-calculators.js','assets/js/localization.js','assets/js/currency-localized-names.js','assets/js/theme-bootstrap.js','service-worker.js','capacitor.config.json','scripts/prepare-android-web.mjs','scripts/patch-android-native.mjs']) {
            if(!fs.existsSync(f)||!fs.statSync(f).size) throw new Error('Missing '+f);
          }
          if((h.match(/data-tool-screen=/g)||[]).length!==24) throw new Error('Expected 24 functional tool cards');
          if(!fs.readFileSync('assets/css/app.css','utf8').includes('SABLE v101.0')) throw new Error('New design system missing');
          console.log('Sable v101 source identity and required files verified.');
          NODE

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run regression tests
        run: npm test

      - name: Build web assets
        run: npm run build:web

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Apply Sable native branding
        run: npm run android:brand

      - name: Build debug APK
        run: npm run android:apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sable-Calculator-v101.0-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
